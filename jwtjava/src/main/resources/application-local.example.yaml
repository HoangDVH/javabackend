# Sao chép thành application-local.yaml (cùng thư mục, không commit) để ghi đè cấu hình máy bạn.
#
# Ví dụ:
# spring:
#   datasource:
#     url: jdbc:mysql://localhost:3306/jwtjava
#     username: root
#     password: matkhau
# jwt:
#   signer-key: "BASE64_256BIT_CUA_BAN"
#
# Upload ảnh sản phẩm lên Cloudinary (POST /api/v1/products/images → trả secure_url):
# app:
#   cloudinary:
#     enabled: true
#     cloud-name: "ten_cloud"
#     api-key: "api_key"
#     api-secret: "api_secret"
#     folder: jwtjava/products
# Hoặc dùng biến môi trường: CLOUDINARY_ENABLED=true, CLOUDINARY_CLOUD_NAME, CLOUDINARY_API_KEY, CLOUDINARY_API_SECRET
#
# Quên mật khẩu (Resend API qua HTTPS — tương thích Render Free):
# app:
#   mail:
#     resend:
#       enabled: true
#       api-key: "re_..."
#       from: "Easy Mart <onboarding@resend.dev>"
#     password-reset:
#       frontend-url: "http://localhost:5173/reset-password"
# Hoặc env: MAIL_ENABLED=true, RESEND_API_KEY, MAIL_FROM, APP_FRONTEND_RESET_URL
#
# Thanh toán VNPay:
# app:
#   vnpay:
#     enabled: true
#     tmn-code: "YOUR_TMN_CODE"
#     hash-secret: "YOUR_HASH_SECRET"
#     return-url: "https://easy-mart-vert.vercel.app/payment/result"
#     ipn-url: "https://javabackend-olfp.onrender.com/api/v1/payments/vnpay/ipn"
# Local dev (SPA chạy port 5173): return-url: "http://localhost:5173/payment/result"
# Hoặc env: VNPAY_ENABLED=true, VNPAY_TMN_CODE, VNPAY_HASH_SECRET,
#           VNPAY_RETURN_URL, VNPAY_IPN_URL
#
# Đăng nhập Google (GIS trên FE → POST /api/v1/auth/google):
# app:
#   google:
#     enabled: true
#     client-id: "YOUR_GOOGLE_WEB_CLIENT_ID.apps.googleusercontent.com"
# Hoặc env: GOOGLE_AUTH_ENABLED=true, GOOGLE_CLIENT_ID=...
# Tạo OAuth Client ID (Web) tại https://console.cloud.google.com/apis/credentials
# Authorized JavaScript origins: https://easy-mart-vert.vercel.app , http://localhost:5173
#
# Chạy local không cần MySQL (H2 in-memory) — xem application-local.yaml mẫu:
# spring:
#   datasource:
#     url: jdbc:h2:mem:jwtjava;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
#     username: sa
#     password: ""
#     driver-class-name: org.h2.Driver
# app:
#   seed-images-from-network: false
