server:
  port: 8080
  forward-headers-strategy: framework
  tomcat:
    # Free-tier Render: keep concurrent workers modest to avoid thrashing.
    threads:
      max: ${SERVER_TOMCAT_THREADS_MAX:50}
      min-spare: ${SERVER_TOMCAT_THREADS_MIN_SPARE:5}
    connection-timeout: ${SERVER_TOMCAT_CONNECTION_TIMEOUT:20s}

# Swagger UI: /swagger-ui.html  |  OpenAPI: /v3/api-docs
# Disable in production: springdoc.swagger-ui.enabled=false
springdoc:
  swagger-ui:
    # Preserve tag order from OpenAPI (Authentication first via @OpenAPIDefinition)
    tags-sorter: none
    operations-sorter: alpha

spring:
  config:
    import: optional:classpath:application-local.yaml
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 50MB
  datasource:
    url: ${JWTJAVA_DATASOURCE_URL:jdbc:mysql://localhost:3307/jwtjava}
    username: ${JWTJAVA_DATASOURCE_USERNAME:root}
    password: ${JWTJAVA_DATASOURCE_PASSWORD:root}
    hikari:
      # Free Postgres ~20–25 connections; leave headroom for admin/migrations.
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:8}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT:10000}
      idle-timeout: ${HIKARI_IDLE_TIMEOUT:300000}
      max-lifetime: ${HIKARI_MAX_LIFETIME:600000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: ${JPA_SHOW_SQL:false}

jwt:
  # Dev mặc định — production bắt buộc đặt JWT_SIGNER_KEY (Base64 256-bit).
  signer-key: ${JWT_SIGNER_KEY:bXktc2VjcmV0LWp3dC1zaWduaW5nLWtleS0yNTZiaXQ=}
  valid-duration: 3600
  refreshable-duration: 36000
  refresh-cookie:
    # Refresh token sẽ được lưu vào HttpOnly cookie (không trả về trong JSON body).
    name: refresh_token
    # Local: Lax + secure=false (http://localhost:5173 ↔ http://localhost:8080 là same-site).
    # SPA dev gọi API HTTPS khác domain (vd Render): None + secure=true — set qua env trên hosting.
    same-site: ${JWT_REFRESH_COOKIE_SAME_SITE:Lax}
    secure: ${JWT_REFRESH_COOKIE_SECURE:false}

# Tài khoản admin tự seed khi app start (nếu email chưa tồn tại).
# Ghi đè mật khẩu: biến môi trường APP_SEED_ADMIN_PASSWORD hoặc sửa giá trị dưới.
app:
  db:
    # Render/Postgres: bật để tự chạy index + trigger SQL lúc startup (idempotent).
    run-sql-migrations-on-startup: ${APP_DB_RUN_SQL_MIGRATIONS_ON_STARTUP:false}
  # Origin SPA (Vite/React thường 5173). Thêm domain production khi deploy.
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:3000
      - https://easy-mart-vert.vercel.app
  # Khi seed/backfill sản phẩm mẫu: true = tải ảnh từ mạng vào storage; false = chỉ lưu URL Picsum (dùng cho test).
  seed-images-from-network: true
  # Khi startup: thay ảnh local cũ (/files/product-images/...) bằng ảnh managed mới để tránh mất ảnh sau redeploy.
  migrate-legacy-local-images-on-startup: true
  seed-admin:
    email: ${APP_SEED_ADMIN_EMAIL:admin@gmail.com}
    password: ${APP_SEED_ADMIN_PASSWORD:Admin@123456}
  # Ảnh sản phẩm: file lưu dưới {root}/product-images/, URL public khớp public-url-path.
  # Đặt public-base-url (vd: http://localhost:8080) nếu muốn DB lưu URL đầy đủ thay vì chỉ path /files/...
  storage:
    root: uploads
    public-url-path: /files/product-images
    public-base-url: ""
    max-bytes: 5242880
    download-timeout-seconds: 30
  # Upload POST /api/v1/products/images → Cloudinary khi enabled=true + đủ cred; response trả list URL https.
  cloudinary:
    enabled: ${CLOUDINARY_ENABLED:false}
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
    folder: jwtjava/products
  redis:
    enabled: ${REDIS_ENABLED:false}
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    blacklist-fail-open: ${REDIS_BLACKLIST_FAIL_OPEN:true}
  cache:
    catalog:
      enabled: ${CATALOG_CACHE_ENABLED:true}
      product-list-ttl-seconds: 120
      product-detail-ttl-seconds: 120
      category-list-ttl-seconds: 1800
      category-detail-ttl-seconds: 1800
      stampede-lock-seconds: 5
      stampede-wait-ms: 400
  observability:
    # Phase 0: log WARN when request elapsedMs >= this threshold.
    slow-request-ms: ${SLOW_REQUEST_MS:1000}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    login:
      max-requests: 10
      window-seconds: 60
    login-by-email:
      max-requests: 5
      window-seconds: 60
    google-login:
      max-requests: 10
      window-seconds: 60
    refresh:
      max-requests: 20
      window-seconds: 60
    register:
      max-requests: 5
      window-seconds: 300
    forgot-password:
      max-requests: 5
      window-seconds: 900
    forgot-password-by-email:
      max-requests: 3
      window-seconds: 900
    reset-password:
      max-requests: 10
      window-seconds: 60
    create-order:
      max-requests: 20
      window-seconds: 60
    create-payment:
      max-requests: 20
      window-seconds: 60
  google:
    enabled: ${GOOGLE_AUTH_ENABLED:false}
    client-id: ${GOOGLE_CLIENT_ID:}
  mail:
    # Gmail SMTP: bật 2FA → tạo App Password tại https://myaccount.google.com/apppasswords
    smtp:
      enabled: ${MAIL_ENABLED:false}
      host: ${MAIL_SMTP_HOST:smtp.gmail.com}
      port: ${MAIL_SMTP_PORT:587}
      username: ${MAIL_SMTP_USERNAME:}
      password: ${MAIL_SMTP_PASSWORD:}
      from: ${MAIL_FROM:}
    password-reset:
      frontend-url: ${APP_FRONTEND_RESET_URL:https://easy-mart-vert.vercel.app/reset-password}
      token-ttl-seconds: 1800
  # Cổng thanh toán VNPay (v2.1.0). Cần URL public cho ipn-url khi deploy.
  vnpay:
    enabled: ${VNPAY_ENABLED:false}
    tmn-code: ${VNPAY_TMN_CODE:}
    hash-secret: ${VNPAY_HASH_SECRET:}
    pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
    return-url: ${VNPAY_RETURN_URL:https://easy-mart-vert.vercel.app/payment/result}
    ipn-url: ${VNPAY_IPN_URL:https://javabackend-olfp.onrender.com/api/v1/payments/vnpay/ipn}
    version: "2.1.0"
    command: pay
    curr-code: VND
    locale: vn
    order-type: other
    expire-minutes: 15
