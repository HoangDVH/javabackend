server:
  port: 8080

# Swagger UI: /swagger-ui.html  |  OpenAPI: /v3/api-docs
# Disable in production: springdoc.swagger-ui.enabled=false
springdoc:
  swagger-ui:
    # Preserve tag order from OpenAPI (Authentication first via @OpenAPIDefinition)
    tags-sorter: none
    operations-sorter: alpha

spring:
  config:
    import: optional:classpath:application-local.yaml
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 50MB
  datasource:
    url: ${JWTJAVA_DATASOURCE_URL:jdbc:mysql://localhost:3307/jwtjava}
    username: ${JWTJAVA_DATASOURCE_USERNAME:root}
    password: ${JWTJAVA_DATASOURCE_PASSWORD:root}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true

jwt:
  # Dev mặc định — production bắt buộc đặt JWT_SIGNER_KEY (Base64 256-bit).
  signer-key: ${JWT_SIGNER_KEY:bXktc2VjcmV0LWp3dC1zaWduaW5nLWtleS0yNTZiaXQ=}
  valid-duration: 3600
  refreshable-duration: 36000
  refresh-cookie:
    # Refresh token sẽ được lưu vào HttpOnly cookie (không trả về trong JSON body).
    name: refresh_token
    # Local: Lax + secure=false (http://localhost:5173 ↔ http://localhost:8080 là same-site).
    # SPA dev gọi API HTTPS khác domain (vd Render): None + secure=true — set qua env trên hosting.
    same-site: ${JWT_REFRESH_COOKIE_SAME_SITE:Lax}
    secure: ${JWT_REFRESH_COOKIE_SECURE:false}

# Tài khoản admin tự seed khi app start (nếu email chưa tồn tại).
# Ghi đè mật khẩu: biến môi trường APP_SEED_ADMIN_PASSWORD hoặc sửa giá trị dưới.
app:
  # Origin SPA (Vite/React thường 5173). Thêm domain production khi deploy.
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:3000
  # Khi seed/backfill sản phẩm mẫu: true = tải ảnh từ mạng vào storage; false = chỉ lưu URL Picsum (dùng cho test).
  seed-images-from-network: true
  seed-admin:
    email: ${APP_SEED_ADMIN_EMAIL:admin@gmail.com}
    password: ${APP_SEED_ADMIN_PASSWORD:Admin@123456}
  # Ảnh sản phẩm: file lưu dưới {root}/product-images/, URL public khớp public-url-path.
  # Đặt public-base-url (vd: http://localhost:8080) nếu muốn DB lưu URL đầy đủ thay vì chỉ path /files/...
  storage:
    root: uploads
    public-url-path: /files/product-images
    public-base-url: ""
    max-bytes: 5242880
    download-timeout-seconds: 30
  # Upload POST /api/v1/products/images → Cloudinary khi enabled=true + đủ cred; response trả list URL https.
  cloudinary:
    enabled: ${CLOUDINARY_ENABLED:false}
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
    folder: jwtjava/products
