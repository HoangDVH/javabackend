# Chạy test không cần MySQL (CI, clone mới). Prod/dev vẫn dùng MySQL theo application.yaml.
spring:
  datasource:
    url: jdbc:h2:mem:jwtjava;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

app:
  seed-images-from-network: false
  vnpay:
    enabled: true
    tmn-code: TIBBMYJU
    hash-secret: 8YJPTW1TD40WLS1I5HTVWUV38V3HZX25
    return-url: http://localhost:5173/payment/result
    ipn-url: http://localhost:8080/api/v1/payments/vnpay/ipn
  mail:
    enabled: false

springdoc:
  swagger-ui:
    enabled: false
