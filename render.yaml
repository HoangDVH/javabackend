services:
  - type: keyvalue
    name: jwtjava-redis
    ipAllowList: []
    plan: free

  - type: web
    name: jwtjava-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: JWT_SIGNER_KEY
        sync: false
      - key: APP_SEED_ADMIN_EMAIL
        value: admin@gmail.com
      - key: APP_SEED_ADMIN_PASSWORD
        sync: false
      - key: APP_SEED_IMAGES_FROM_NETWORK
        value: "false"
      # Cookie refresh gửi được từ SPA khác domain (vd http://localhost:5173 → HTTPS Render).
      - key: JWT_REFRESH_COOKIE_SAME_SITE
        value: None
      - key: JWT_REFRESH_COOKIE_SECURE
        value: "true"
      - key: APP_CORS_ALLOWED_ORIGINS
        value: "https://easy-mart-vert.vercel.app,http://localhost:5173,http://localhost:3000"
      - key: DATABASE_URL
        sync: false
      - key: CLOUDINARY_ENABLED
        value: "true"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: REDIS_ENABLED
        value: "true"
      - key: REDIS_HOST
        fromService:
          type: keyvalue
          name: jwtjava-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: keyvalue
          name: jwtjava-redis
          property: port
      - key: MAIL_ENABLED
        value: "true"
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: APP_FRONTEND_RESET_URL
        value: "https://easy-mart-vert.vercel.app/reset-password"
