services:
  - type: web
    name: jwtjava-api
    runtime: docker
    rootDir: jwtjava
    dockerfilePath: ./Dockerfile
    envVars:
      - key: JWT_SIGNER_KEY
        sync: false
      - key: APP_SEED_ADMIN_EMAIL
        value: admin@gmail.com
      - key: APP_SEED_ADMIN_PASSWORD
        sync: false
      - key: APP_SEED_IMAGES_FROM_NETWORK
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: jwtjava-postgres
          property: connectionString

databases:
  - name: jwtjava-postgres
    databaseName: jwtjava
    user: jwtjava
